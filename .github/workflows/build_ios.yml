name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build iOS App (.ipa)
    runs-on: macos-14

    steps:
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Environment
        run: |
          echo "APP_SERVICE_KEY=${{ secrets.APP_SERVICE_KEY }}" > .env
          echo "GEMINI_API_KEY=${{ secrets.APP_SERVICE_KEY }}" >> .env
        shell: bash

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Create .ipa Archive
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ResistorLab.ipa Payload
        shell: bash

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResistorLab-iOS-IPA
          path: ResistorLab.ipa
